<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Virtue Icon Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: wheel stage on the left, roster panel (on the wheel / assigned) on the right; stacks on phones. */
:root {
  --bg: #f4f5f9; --surface: #ffffff; --ink: #18213d; --muted: #5d6680; --line: #d9dde8;
  --navy: #1d2a52; --gold: #e8a530; --gold-ink: #3a2a06; --danger: #a8243f; --ok: #1f7a5a;
  --shadow: 0 1px 2px rgba(24,33,61,.06), 0 8px 24px rgba(24,33,61,.08);
  --display: 'Oswald', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1425; --surface: #182039; --ink: #e8ebf5; --muted: #a2aac2; --line: #2c3656;
  --navy: #2b3d75; --gold: #f0b44a; --gold-ink: #241a03; --danger: #e06a82; --ok: #5cc79e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1425; --surface: #182039; --ink: #e8ebf5; --muted: #a2aac2; --line: #2c3656;
  --navy: #2b3d75; --gold: #f0b44a; --gold-ink: #241a03; --danger: #e06a82; --ok: #5cc79e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
.eyebrow { font: 600 12px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(30px, 5vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 4px 0 0; color: var(--ink); text-wrap: balance; }
h1 span { color: var(--gold); }
.count { font: 500 14px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { font: 700 22px var(--display); color: var(--ink); }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.stage { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; }
.wheel-box { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; }
canvas { width: 100%; height: 100%; display: block; cursor: pointer; border-radius: 50%; }
.pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 30px solid var(--gold); filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); z-index: 2; }
.hub { position: absolute; top: 50%; left: 50%; width: 19%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: var(--navy); border: 4px solid var(--gold); color: #fff; font: 700 clamp(14px, 2.6vw, 20px) var(--display); text-transform: uppercase; letter-spacing: .06em; display: grid; place-items: center; cursor: pointer; padding: 0; }
.hub:disabled { cursor: default; opacity: .9; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; width: 100%; }
label.field { display: flex; flex-direction: column; gap: 4px; font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input[type=text] { font: 500 16px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: min(260px, 70vw); }
button { font: 600 14px var(--body); border-radius: 8px; border: 1px solid transparent; padding: 10px 16px; cursor: pointer; }
button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn-spin { background: var(--gold); color: var(--gold-ink); font: 700 17px var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 12px 28px; align-self: flex-end; }
.btn-spin:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-small { padding: 6px 10px; font-size: 13px; }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--line); }
.result { width: 100%; border: 2px solid var(--gold); border-radius: 12px; padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.result img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; flex: none; }
.result .info { flex: 1 1 220px; min-width: 0; }
.result h2 { font: 700 28px/1.05 var(--display); text-transform: uppercase; margin: 4px 0; }
.result .meta { color: var(--muted); font-size: 14px; }
.result .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { display: inline-block; font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: #fff; padding: 3px 8px; border-radius: 4px; }
.example { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.panel h3 { font: 600 18px var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h3 small { font: 500 13px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow-y: auto; }
.list li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); min-width: 0; }
.list img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
.list .nm { flex: 1; min-width: 0; }
.list .nm b { display: block; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.list .nm span { font-size: 12px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm { border: 1px solid var(--danger); border-radius: 10px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm p { margin: 0; flex: 1 1 200px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; z-index: 20; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

</head>
<body style="margin:0">
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">8th Grade Civics · One-Pager Project</div>
      <h1>Icons of <span>Civic Virtue</span></h1>
    </div>
    <div class="count"><b id="leftCount">36</b> of 36 icons still on the wheel</div>
  </header>

  <div class="grid">
    <section class="stage" aria-label="Picker wheel">
      <div class="wheel-box">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" tabindex="0" aria-label="Picker wheel. Press Enter or Space to spin."></canvas>
        <button class="hub" id="hub" type="button" aria-label="Spin the wheel">Spin</button>
      </div>
      <div class="controls">
        <label class="field" for="student">Student (optional)
          <input type="text" id="student" placeholder="Type a student's name" autocomplete="off">
        </label>
        <button class="btn-spin" id="spinBtn" type="button">Spin</button>
      </div>
      <div class="result" id="result" hidden>
        <img id="resImg" alt="">
        <div class="info">
          <span class="chip" id="resVirtue"></span>
          <h2 id="resName"></h2>
          <div class="meta" id="resMeta"></div>
          <div class="actions">
            <button class="btn-primary" id="assignBtn" type="button">Assign and remove from wheel</button>
            <button class="btn-ghost" id="keepBtn" type="button">Keep on wheel</button>
          </div>
        </div>
      </div>
      <div class="legend" id="legend" aria-label="Wheel colors by virtue"></div>
    </section>

    <aside class="panel" aria-label="Roster">
      <div>
        <h3>Assigned <small id="doneCount">0</small></h3>
        <ul class="list" id="doneList"></ul>
        <div class="row" style="margin-top:10px">
          <button class="btn-ghost btn-small" id="copyBtn" type="button">Copy assignment list</button>
          <button class="btn-danger btn-small" id="resetBtn" type="button">Add everyone back</button>
        </div>
        <div class="confirm" id="confirmBox" hidden>
          <p>Put all 36 icons back on the wheel and clear the assignment list?</p>
          <button class="btn-primary btn-small" id="confirmYes" type="button">Yes, reset</button>
          <button class="btn-ghost btn-small" id="confirmNo" type="button">Cancel</button>
        </div>
        <textarea id="copyFallback" hidden readonly style="width:100%;margin-top:8px;min-height:120px;font:13px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
      </div>
      <div>
        <h3>On the wheel <small id="onCount">36</small></h3>
        <ul class="list" id="onList"></ul>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

    let label = p.name; const maxW = r * 0.68;
    while (ctx.measureText(label).width > maxW && label.length > 4) label = label.slice(0, -2).trimEnd() + '…';
    ctx.fillText(label, r - 12, 0); ctx.restore();
  });
  ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.lineWidth = 4; ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--gold'); ctx.stroke();
}

function spin() {
  const items = wheelItems();
  if (spinning || !items.length) return;
  hideResult(); spinning = true; setSpinUI();
  const n = items.length, seg = Math.PI * 2 / n;
  const w = Math.floor(Math.random() * n), u = 0.15 + Math.random() * 0.7;
  const pointer = -Math.PI / 2;
  let target = pointer - (w + u) * seg;
  const turns = reduce ? 1 : 6 + Math.floor(Math.random() * 3);
  while (target < rot + turns * Math.PI * 2) target += Math.PI * 2;
  const start = rot, dist = target - start, dur = reduce ? 600 : 5200, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    rot = start + dist * ease(t); draw();
    if (t < 1) requestAnimationFrame(frame);
    else { rot = ((rot % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2); spinning = false; showResult(items[w]); setSpinUI(); }
  }
  requestAnimationFrame(frame);
}

function showResult(p) {
  current = p;
  $('resImg').src = T[p.id]; $('resImg').alt = 'Portrait of ' + p.name;
  $('resVirtue').textContent = p.virtue; $('resVirtue').style.background = p.color;
  $('resName').textContent = p.name;
  const st = $('student').value.trim();
  $('resMeta').textContent = (st ? 'For ' + st + ' · ' : '') + 'Pamphlet page ' + p.page;
  $('assignBtn').textContent = st ? 'Assign to ' + st + ' and remove' : 'Assign and remove from wheel';
  $('result').hidden = false;
}
function hideResult() { $('result').hidden = true; current = null; }

function assign(id, student) {
  state.remaining = state.remaining.filter(x => x !== id);
  state.assigned.unshift({ id, student: student || '' });
  save(); render();
}
function addBack(id) {
  state.assigned = state.assigned.filter(a => a.id !== id);
  if (!state.remaining.includes(id)) state.remaining.push(id);
  state.remaining.sort((a, b) => PEOPLE.findIndex(p => p.id === a) - PEOPLE.findIndex(p => p.id === b));
  save(); render(); toast(BY[id].name + ' is back on the wheel');
}

function li(p, sub, btnText, btnClass, onClick) {
  const el = document.createElement('li');
  el.innerHTML = `<img alt=""><div class="nm"><b></b><span></span></div><span class="dot"></span><button type="button" class="btn-small ${btnClass}"></button>`;
  el.querySelector('img').src = T[p.id];
  el.querySelector('b').textContent = p.name;
  el.querySelector('.nm span').textContent = sub;
  el.querySelector('.dot').style.background = p.color;
  const b = el.querySelector('button'); b.textContent = btnText; b.setAttribute('aria-label', btnText + ': ' + p.name); b.onclick = onClick;
  return el;
}

function render() {
  const on = wheelItems();
  $('leftCount').textContent = on.length; $('onCount').textContent = on.length; $('doneCount').textContent = state.assigned.length;
  const onList = $('onList'); onList.replaceChildren();
  if (!on.length) onList.innerHTML = '<li class="empty" style="border:0">Every icon has been assigned. Add people back from the Assigned list.</li>';
  on.forEach(p => onList.append(li(p, p.virtue + ' · p. ' + p.page, 'Remove', 'btn-danger', () => { assign(p.id, ''); if (current && current.id === p.id) hideResult(); toast(p.name + ' removed from the wheel'); })));
  const done = $('doneList'); done.replaceChildren();
  if (!state.assigned.length) done.innerHTML = '<li class="empty" style="border:0">No one assigned yet. Spin the wheel, then choose Assign.</li>';
  state.assigned.forEach(a => { const p = BY[a.id]; done.append(li(p, (a.student ? a.student + ' · ' : 'No student entered · ') + p.virtue, 'Add back', 'btn-ghost', () => addBack(p.id))); });
  setSpinUI(); draw();
}
function setSpinUI() {
  const none = !wheelItems().length;
  $('spinBtn').disabled = spinning || none; $('hub').disabled = spinning || none;
  $('spinBtn').textContent = none ? 'Wheel empty' : spinning ? 'Spinning…' : 'Spin';
}

let tt; function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

$('spinBtn').onclick = spin; $('hub').onclick = spin; canvas.onclick = spin;
canvas.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); } };
$('assignBtn').onclick = () => { if (!current) return; const p = current, st = $('student').value.trim(); assign(p.id, st); hideResult(); $('student').value = ''; toast(p.name + (st ? ' assigned to ' + st : ' removed from the wheel')); $('student').focus(); };
$('keepBtn').onclick = () => { hideResult(); };
$('resetBtn').onclick = () => { $('confirmBox').hidden = false; };
$('confirmNo').onclick = () => { $('confirmBox').hidden = true; };
$('confirmYes').onclick = () => { state = { remaining: PEOPLE.map(p => p.id), assigned: [] }; save(); $('confirmBox').hidden = true; hideResult(); render(); toast('All 36 icons are back on the wheel'); };
$('copyBtn').onclick = () => {
  const txt = state.assigned.slice().reverse().map(a => `${a.student || '(no student)'}\t${BY[a.id].name}\t${BY[a.id].virtue}\tp. ${BY[a.id].page}`).join('\n') || 'No assignments yet';
  const fb = () => { const f = $('copyFallback'); f.value = txt; f.hidden = false; f.select(); toast('Select and copy the list below'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Assignment list copied'), fb); } catch (e) { fb(); }
};
const leg = $('legend'); Object.entries(VIRTUES).forEach(([v, [col]]) => { const s = document.createElement('span'); s.innerHTML = '<i class="dot"></i>'; s.querySelector('i').style.background = col; s.append(v); leg.append(s); });
new ResizeObserver(() => draw()).observe(canvas);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
render();
</script>

</body>
</html>
